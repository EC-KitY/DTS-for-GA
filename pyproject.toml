[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eckity-dts"
version = "0.1.1"
description = "Deep Tournament Selection operator for EC-KitY genetic algorithms"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Eliad Shem-Tov" },
    { name = "Ron Edri" },
    { name = "Achiya Elyasaf" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "eckity~=0.4.2",
    "numpy>=2.0.2",
    "overrides>=7.7.0",
    "scipy>=1.13.0",
    "torch>=2.7.1",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "ruff>=0.5",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/EC-KitY/DTS-for-GA"
Repository = "https://github.com/EC-KitY/DTS-for-GA"

[tool.setuptools]
packages = [
    "eckity_dts",
    "deep_tournament_selection",
    "deep_tournament_selection.selection",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.uv]
resolution = "lowest-direct"
